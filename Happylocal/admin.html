<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해피로컬 운영</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🧺</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
  /* 여행자 앱은 420px 폰 목업입니다. 운영 화면은 매장 카운터의 태블릿과
     농가의 폰에서 같이 쓰이므로 별도 레이아웃으로 갑니다. */
  :root{
    --bg:#f4f5f3; --surface:#fff; --surface-2:#fafbfa; --border:#e2e5e1;
    --text:#1e2420; --text-mut:#6b736d; --text-hi:#0f1512;
    --brand:#2B8A3D; --brand-soft:#e8f5ea; --brand-deep:#20692e;
    --warn:#b4790a; --warn-soft:#fdf3e0; --danger:#c0392b; --danger-soft:#fdeceb;
    --radius:10px; --shadow:0 1px 2px rgba(20,30,24,.06),0 4px 14px rgba(20,30,24,.05);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#141815; --surface:#1c211d; --surface-2:#222824; --border:#2f3733;
      --text:#dfe5e0; --text-mut:#939c95; --text-hi:#f2f6f3;
      --brand:#4caf62; --brand-soft:#1d2f22; --brand-deep:#3f9553;
      --warn:#e0a53c; --warn-soft:#312712; --danger:#e0685c; --danger-soft:#331d1b;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141815; --surface:#1c211d; --surface-2:#222824; --border:#2f3733;
    --text:#dfe5e0; --text-mut:#939c95; --text-hi:#f2f6f3;
    --brand:#4caf62; --brand-soft:#1d2f22; --brand-deep:#3f9553;
    --warn:#e0a53c; --warn-soft:#312712; --danger:#e0685c; --danger-soft:#331d1b;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3{margin:0;color:var(--text-hi);text-wrap:balance}

  /* ---------- 레이아웃 ---------- */
  .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
  @media (max-width:820px){ .app{grid-template-columns:1fr} }

  .side{background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:18px 14px;gap:4px}
  @media (max-width:820px){
    .side{border-right:0;border-bottom:1px solid var(--border);padding:12px}
    .side .nav{flex-direction:row;overflow-x:auto;gap:6px}
    .side .who{margin-bottom:10px}
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;
    color:var(--text-hi);padding:0 8px 14px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:0 0 auto}
  .who{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
    padding:10px 12px;margin-bottom:12px}
  .who b{display:block;font-size:13.5px;color:var(--text-hi)}
  .who .roles{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .rolechip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;
    background:var(--brand-soft);color:var(--brand-deep);white-space:nowrap}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    padding:9px 11px;border:0;border-radius:8px;background:transparent;
    font-weight:600;font-size:13.5px;color:var(--text-mut);cursor:pointer;white-space:nowrap}
  .nav button:hover{background:var(--surface-2);color:var(--text-hi)}
  .nav button.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
  .nav .grp{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--text-mut);
    padding:12px 11px 5px;text-transform:uppercase}
  @media (max-width:820px){ .nav .grp{display:none} }

  .main{padding:26px 30px 60px;max-width:1080px}
  @media (max-width:820px){ .main{padding:18px 14px 50px} }
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    flex-wrap:wrap;margin-bottom:20px}
  .head h1{font-size:22px;font-weight:800}
  .head p{margin:4px 0 0;color:var(--text-mut);font-size:13px}

  /* ---------- 조각 ---------- */
  .card{background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:12px}
  .g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px}
  .stat .k{font-size:12px;font-weight:700;color:var(--text-mut)}
  .stat .v{font-size:24px;font-weight:800;color:var(--text-hi);margin-top:2px;
    font-variant-numeric:tabular-nums}
  .stat.accent .v{color:var(--brand)}

  .btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;
    padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
  .btn:hover{background:var(--surface-2)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand-deep)}
  .btn.danger{color:var(--danger);border-color:var(--danger)}
  .btn.danger:hover{background:var(--danger-soft)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{padding:5px 10px;font-size:12px}

  input[type=text],input[type=number],input[type=date],select,textarea{
    border:1px solid var(--border);background:var(--surface);border-radius:8px;
    padding:8px 11px;font-size:13.5px;width:100%}
  input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{
    outline:2px solid var(--brand);outline-offset:1px}
  label{font-size:12px;font-weight:700;color:var(--text-mut);display:block;margin-bottom:4px}

  .tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface)}
  table{border-collapse:collapse;width:100%;min-width:600px}
  th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--border);font-size:13px}
  th{background:var(--surface-2);font-weight:700;color:var(--text-mut);font-size:12px;
    white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

  .pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
  .pill.reserved{background:var(--warn-soft);color:var(--warn)}
  .pill.completed{background:var(--brand-soft);color:var(--brand-deep)}
  .pill.cancelled{background:var(--surface-2);color:var(--text-mut)}
  .pill.noshow{background:var(--danger-soft);color:var(--danger)}

  .empty{padding:34px 18px;text-align:center;color:var(--text-mut);font-size:13.5px}
  .msg{margin:0 0 14px;padding:10px 13px;border-radius:8px;font-size:13px;font-weight:600}
  .msg.ok{background:var(--brand-soft);color:var(--brand-deep)}
  .msg.err{background:var(--danger-soft);color:var(--danger)}

  /* 예약코드 조회 — 카운터에서 가장 많이 쓰는 입력이라 크게 둡니다 */
  .lookup{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
  .lookup .f{flex:1;min-width:200px}
  .lookup input{font-size:19px;font-weight:800;letter-spacing:.08em;padding:11px 14px;
    text-transform:uppercase;font-variant-numeric:tabular-nums}
  .hit{margin-top:14px;border:2px solid var(--brand);border-radius:var(--radius);
    padding:15px 17px;background:var(--brand-soft)}
  .hit .nm{font-size:17px;font-weight:800;color:var(--text-hi)}
  .hit .meta{color:var(--text-mut);font-size:13px;margin-top:3px}
  .hit .acts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}

  .prow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:13px 0;border-bottom:1px solid var(--border)}
  .prow:last-child{border-bottom:0}
  .prow .info{flex:1;min-width:170px}
  .prow .nm{font-weight:700;color:var(--text-hi)}
  .prow .sub{font-size:12.5px;color:var(--text-mut);margin-top:2px}
  .prow .qty{width:88px;flex:0 0 auto}
  .stockbadge{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;
    min-width:52px;text-align:right}
  .stockbadge.low{color:var(--danger)}
  .stockbadge.zero{color:var(--text-mut)}

  .gate{max-width:400px;margin:14vh auto;padding:0 18px}
  .gate .card{text-align:center}
  .gate h1{font-size:19px;margin-bottom:6px}
  .gate p{color:var(--text-mut);font-size:13px;margin:0 0 18px}
  .devbox{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);text-align:left}

  textarea{resize:vertical;min-height:120px}
  @media (max-width:820px){ #cwrap{grid-template-columns:1fr!important} }
  .hint{font-size:12px;color:var(--text-mut);margin-top:7px}
  .rowact{display:flex;gap:6px;flex-wrap:wrap}
  [hidden]{display:none!important}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <div class="card">
    <h1>해피로컬 운영</h1>
    <p>농가 · 픽업 거점 · 운영 담당자용 화면입니다.</p>
    <button class="btn pri" style="width:100%" onclick="location.href='/api/auth/kakao'">카카오로 로그인</button>

    <form class="devbox" onsubmit="return localLogin(event)" style="text-align:left">
      <label for="lg-id">아이디</label>
      <input type="text" id="lg-id" autocomplete="username" autocapitalize="none" spellcheck="false">
      <label for="lg-pw" style="margin-top:8px">비밀번호</label>
      <input type="password" id="lg-pw" autocomplete="current-password">
      <button class="btn pri" style="width:100%;margin-top:11px" type="submit">로그인</button>
    </form>

    <div id="devbox" class="devbox" hidden>
      <label>로컬 확인용 로그인</label>
      <input type="text" id="dev-nick" placeholder="이름" value="운영 테스트">
      <select id="dev-role" style="margin-top:7px">
        <option value="store_manager">매장 관리인</option>
        <option value="producer">생산자</option>
        <option value="operator">운영자</option>
        <option value="super_admin">최고관리자</option>
      </select>
      <button class="btn" style="width:100%;margin-top:7px" onclick="devLogin()">로그인</button>
      <p class="hint">배포 환경에서는 이 상자가 나오지 않습니다.</p>
    </div>
    <p id="gate-msg" class="msg err" style="margin-top:14px" hidden></p>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><span class="dot"></span>해피로컬 운영</div>
    <div class="who">
      <b id="who-name">—</b>
      <div class="roles" id="who-roles"></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <button class="btn sm" style="margin-top:14px" onclick="logout()">로그아웃</button>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* =================================================================
   해피로컬 운영 화면.

   역할별 API 는 docs/roles.md §6 을 따릅니다. 이 화면은 /api/auth/roles 가
   내려주는 역할·범위로 메뉴를 정하고, 각 요청의 권한 검사는 서버가 합니다.
   화면에서 메뉴를 숨기는 것은 편의일 뿐 보안 장치가 아닙니다.
   ================================================================= */

let ME = null;
let VIEW = '';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const won = (n) => Number(n || 0).toLocaleString('ko-KR') + '원';
const num = (n) => Number(n || 0).toLocaleString('ko-KR');
const todayStr = () => new Date().toISOString().slice(0, 10);

async function api(path, opt) {
  const r = await fetch(path, {
    ...(opt || {}),
    headers: { 'Content-Type': 'application/json', ...((opt || {}).headers || {}) },
  });
  let body = null;
  try { body = await r.json(); } catch (e) { /* 본문 없음 */ }
  if (!r.ok) {
    const err = new Error((body && body.error) || `요청 실패 (${r.status})`);
    err.status = r.status; err.code = body && body.code;
    throw err;
  }
  return body;
}
const post = (p, b) => api(p, { method: 'POST', body: JSON.stringify(b || {}) });
const patch = (p, b) => api(p, { method: 'PATCH', body: JSON.stringify(b || {}) });
const put = (p, b) => api(p, { method: 'PUT', body: JSON.stringify(b || {}) });

function say(kind, text) {
  const el = $('msg');
  if (!el) return;
  el.className = 'msg ' + kind;
  el.textContent = text;
  el.hidden = false;
  if (kind === 'ok') setTimeout(() => { if (el.textContent === text) el.hidden = true; }, 3500);
}

/* ---------------- 메뉴 ---------------- */

const VIEWS = [
  { id: 'pickups',  label: '오늘 픽업',    group: '매장',   need: 'order:read:store' },
  { id: 'closing',  label: '일일 마감',    group: '매장',   need: 'store:stats' },
  { id: 'mystores', label: '매장 정보',    group: '매장',   need: 'store:write' },
  { id: 'shipping', label: '오늘 출하',    group: '농가',   need: 'product:write' },
  { id: 'sales',    label: '판매 현황',    group: '농가',   need: 'producer:stats' },
  { id: 'mysettle', label: '정산',        group: '농가',   need: 'producer:stats' },
  { id: 'content',  label: '콘텐츠 편집',  group: '운영',   need: 'content:write' },
  { id: 'coupons',  label: '쿠폰 발행',    group: '운영',   need: 'coupon:issue' },
  { id: 'reviews',  label: '후기 관리',    group: '운영',   need: 'review:moderate' },
  { id: 'stats',    label: '전체 통계',    group: '운영',   need: 'stats:read' },
  { id: 'settle',   label: '정산 집행',    group: '운영',   need: 'stats:read' },
  { id: 'apply',    label: '입점 심사',    group: '운영',   need: 'store:approve' },
  { id: 'users',    label: '계정 · 역할',  group: '운영',   need: 'user:role:write' },
  { id: 'audit',    label: '감사 로그',    group: '운영',   need: 'audit:read' },
];

function allowed() {
  return VIEWS.filter((v) => ME.can[v.need]);
}

function renderNav() {
  const list = allowed();
  let html = '', grp = '';
  for (const v of list) {
    if (v.group !== grp) { grp = v.group; html += `<div class="grp">${esc(grp)}</div>`; }
    html += `<button data-view="${v.id}" class="${v.id === VIEW ? 'on' : ''}"
      onclick="go('${v.id}')">${esc(v.label)}</button>`;
  }
  $('nav').innerHTML = html || '<div class="grp">권한 없음</div>';
}

function go(id) {
  VIEW = id;
  renderNav();
  const fn = RENDER[id];
  $('main').innerHTML = '<div class="empty">불러오는 중…</div>';
  Promise.resolve(fn ? fn() : '<div class="empty">화면을 찾을 수 없습니다.</div>')
    .then((html) => { $('main').innerHTML = html; })
    .catch((e) => {
      $('main').innerHTML = `<div class="card"><p class="msg err">${esc(e.message)}</p></div>`;
    });
}

function page(title, desc, body, right) {
  return `<div class="head"><div><h1>${esc(title)}</h1>
    ${desc ? `<p>${esc(desc)}</p>` : ''}</div>${right || ''}</div>
    <p id="msg" class="msg" hidden></p>${body}`;
}

const STATUS_KO = { reserved: '대기', completed: '수령완료', cancelled: '취소', noshow: '노쇼' };
const pill = (s) => `<span class="pill ${s}">${STATUS_KO[s] || s}</span>`;

/* ================================================================
   매장 관리인
   ================================================================ */

const RENDER = {};

RENDER.pickups = async () => {
  const d = await api('/api/store/pickups');
  const waiting = d.pickups.filter((p) => p.status === 'reserved');
  const done = d.pickups.filter((p) => p.status === 'completed');

  const rows = d.pickups.length ? d.pickups.map((p) => `
    <tr>
      <td style="font-weight:800;font-variant-numeric:tabular-nums">${esc(p.code)}</td>
      <td>${esc(p.productName)}<div style="color:var(--text-mut);font-size:12px">${esc(p.farm)}</div></td>
      <td class="num">${p.qty}</td>
      <td class="num">${won(p.total)}</td>
      <td>${esc(p.buyerName || '')}</td>
      <td>${pill(p.status)}</td>
      <td><div class="rowact">${p.status === 'reserved' ? `
        <button class="btn sm pri" onclick="doComplete('${p.orderId}')">수령 확인</button>
        <button class="btn sm danger" onclick="doNoshow('${p.orderId}')">노쇼</button>` : ''}</div></td>
    </tr>`).join('') : '';

  return page('오늘 픽업', '손님이 예약코드를 대면 조회해서 수령 확인을 찍습니다.', `
    <div class="card" style="margin-bottom:16px">
      <div class="lookup">
        <div class="f">
          <label for="lk">예약코드</label>
          <input type="text" id="lk" placeholder="HL-0000" autocomplete="off"
            onkeydown="if(event.key==='Enter')doLookup()">
        </div>
        <button class="btn pri" onclick="doLookup()">조회</button>
      </div>
      <div id="hit"></div>
    </div>

    <div class="grid g4" style="margin-bottom:16px">
      <div class="stat"><div class="k">대기</div><div class="v">${waiting.length}</div></div>
      <div class="stat accent"><div class="k">수령완료</div><div class="v">${done.length}</div></div>
      <div class="stat"><div class="k">전체</div><div class="v">${d.count}</div></div>
    </div>

    <div class="tblwrap">
      ${rows ? `<table>
        <thead><tr><th>예약코드</th><th>상품</th><th class="num">수량</th>
          <th class="num">금액</th><th>예약자</th><th>상태</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>`
      : '<div class="empty">담당 거점에 예약이 없습니다.</div>'}
    </div>`);
};

async function doLookup() {
  const code = ($('lk').value || '').trim().toUpperCase();
  const hit = $('hit');
  if (!code) { hit.innerHTML = ''; return; }
  hit.innerHTML = '<div class="hint">찾는 중…</div>';
  try {
    const { pickup: p } = await api('/api/store/pickups/lookup?code=' + encodeURIComponent(code));
    hit.innerHTML = `<div class="hit">
      <div class="nm">${esc(p.productName)} · ${p.qty}개</div>
      <div class="meta">${esc(p.farm)} · ${esc(p.buyerName || '')}
        ${p.phone ? ' · ' + esc(p.phone) : ''} · ${won(p.total)}</div>
      <div class="meta">${pill(p.status)}</div>
      <div class="acts">${p.status === 'reserved' ? `
        <button class="btn pri" onclick="doComplete('${p.orderId}')">수령 확인</button>
        <button class="btn danger" onclick="doNoshow('${p.orderId}')">노쇼 처리</button>`
        : '<span class="hint">이미 처리된 예약입니다.</span>'}</div>
    </div>`;
  } catch (e) {
    hit.innerHTML = `<div class="hit" style="border-color:var(--danger);background:var(--danger-soft)">
      <div class="nm">${esc(e.message)}</div>
      <div class="meta">코드를 다시 확인해 주세요.</div></div>`;
  }
}

async function doComplete(orderId) {
  try {
    await post(`/api/store/pickups/${orderId}/complete`);
    go('pickups');
    setTimeout(() => say('ok', '수령 확인했습니다.'), 30);
  } catch (e) { say('err', e.message); }
}

async function doNoshow(orderId) {
  // 신선식품은 하루 지나면 폐기라, 되돌리면 팔 수 없는 물건이 재고에 잡힙니다.

async function adjust(productId, name) {
  // 재고를 손으로 바꿀 때는 사유를 반드시 남깁니다. 그래야 나중에 설명이 됩니다.
  const raw = prompt(`${name}\n\n조정 수량 (파손·폐기는 -3 처럼 음수)`, '-1');
  if (raw === null) return;
  const delta = parseInt(raw, 10);
  if (!Number.isInteger(delta) || delta === 0) { say('err', '0 이 아닌 정수를 넣어 주세요.'); return; }
  const note = prompt('조정 사유 (필수)', '');
  if (!note) { say('err', '사유가 필요합니다.'); return; }
  try {
    const r = await post(`/api/store/products/${encodeURIComponent(productId)}/adjust`, { delta, note });
    go('mystores');
    setTimeout(() => say('ok', `${name} 재고를 ${r.product.stock}개로 조정했습니다.`), 30);
  } catch (e) { say('err', e.message); }
}

/** 기간을 바꾸는 줄. 정산 화면 두 개가 같이 씁니다. */
function dateRangeBar(view, from, to) {
  return `<div class="card" style="margin-bottom:14px">
    <div class="lookup">
      <div class="f" style="max-width:180px"><label>시작</label>
        <input type="date" id="r-from" value="${esc(from)}"></div>
      <div class="f" style="max-width:180px"><label>종료</label>
        <input type="date" id="r-to" value="${esc(to)}"></div>
      <button class="btn pri" onclick="applyRange('${view}')">조회</button>
      <button class="btn" onclick="applyRange('${view}', 'this')">이번 달</button>
      <button class="btn" onclick="applyRange('${view}', 'last')">지난달</button>
    </div>
  </div>`;
}

function applyRange(view, preset) {
  if (preset === 'this') {
    window._settleRange = null;                 // 서버 기본값이 이번 달입니다
  } else if (preset === 'last') {
    const n = new Date();
    const p = (d) => d.toISOString().slice(0, 10);
    window._settleRange = {
      from: p(new Date(Date.UTC(n.getFullYear(), n.getMonth() - 1, 1))),
      to: p(new Date(Date.UTC(n.getFullYear(), n.getMonth(), 0))),
    };
  } else {
    window._settleRange = { from: $('r-from').value, to: $('r-to').value };
  }
  go(view);
}

  try {

  } catch (e) {
    say('err', e.code === 'WOULD_EMPTY'
      ? '값을 통째로 비우려 했습니다. 의도한 것이라면 항목을 하나만 남겨 저장하세요.'

RENDER.apply = async () => {
  const d = await api('/api/admin/applications?status=' + (window._applyStatus || 'pending'));
  const st = window._applyStatus || 'pending';

  const rows = d.applications.length ? d.applications.map((a) => `<tr>
    <td>${esc(a.nickname)}<div style="color:var(--text-mut);font-size:12px">${esc(a.email)}</div></td>
    <td>${esc(ROLE_KO[a.role] || a.role)}</td>
    <td>${esc(a.farm || '—')}</td>
    <td style="font-size:12px;color:var(--text-mut);max-width:260px">${esc(a.memo || '')}</td>
    <td>${esc(String(a.createdAt).slice(0, 10))}</td>
    <td>${a.status === 'pending' ? `
      <div class="rowact">
        <button class="btn sm pri" onclick="decide('${esc(a.id)}',true)">승인</button>
        <button class="btn sm danger" onclick="decide('${esc(a.id)}',false)">반려</button>
      </div>` : `<span class="pill ${a.status === 'approved' ? 'completed' : 'noshow'}">
        ${a.status === 'approved' ? '승인' : '반려'}</span>`}</td>
  </tr>`).join('') : '';

  return page('입점 심사', '농가·매장이 신청하면 여기에 쌓입니다. 승인하면 그 자리에서 역할과 범위가 붙습니다.', `
    <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap">
      ${['pending', 'approved', 'rejected', 'all'].map((k) => `<button class="btn sm"
        style="${k === st ? 'background:var(--brand);border-color:var(--brand);color:#fff' : ''}"
        onclick="window._applyStatus='${k}';go('apply')">${
          { pending: '심사 대기', approved: '승인', rejected: '반려', all: '전체' }[k]}</button>`).join('')}
    </div>
    <div class="tblwrap">${rows ? `<table>
      <thead><tr><th>신청자</th><th>역할</th><th>농가 · 매장</th><th>신청 내용</th>
        <th>신청일</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="empty">해당하는 신청이 없습니다.</div>'}</div>`);
};

async function decide(id, approve) {
  if (!confirm(approve ? '승인하면 역할과 담당 범위가 바로 붙습니다.' : '반려합니다.')) return;
  const note = approve ? '' : (prompt('반려 사유', '') || '');
  try {
    await post(`/api/admin/applications/${encodeURIComponent(id)}/decide`, { approve, note });
    go('apply');
    setTimeout(() => say('ok', approve ? '승인했습니다.' : '반려했습니다.'), 30);
  } catch (e) { say('err', e.message); }
}

    <td>${esc(r.region)}</td><td class="num">${num(r.orders)}</td>
    <td class="num">${num(r.qty)}</td><td class="num">${won(r.revenue)}</td>
  </tr>`).join('') : '';

  return page('전체 통계', '', `
    <div class="grid g4">
      <div class="stat"><div class="k">가입자</div><div class="v">${num(s.users)}</div></div>
      <div class="stat"><div class="k">상품</div><div class="v">${num(s.products)}</div></div>
      <div class="stat"><div class="k">거점</div><div class="v">${num(s.stores)}</div></div>
      <div class="stat accent"><div class="k">매출</div><div class="v">${won(s.revenue)}</div></div>
    </div>
    <div class="grid g4" style="margin-top:12px">
      <div class="stat"><div class="k">대기</div><div class="v">${s.orders.reserved}</div></div>
      <div class="stat"><div class="k">수령완료</div><div class="v">${s.orders.completed}</div></div>
      <div class="stat"><div class="k">취소</div><div class="v">${s.orders.cancelled}</div></div>
      <div class="stat"><div class="k">노쇼</div><div class="v">${s.orders.noshow}</div></div>
    </div>
    <div class="grid g3" style="margin-top:12px">
      <div class="stat"><div class="k">전체 재고</div><div class="v">${num(s.stock.total)}</div></div>
      <div class="stat"><div class="k">품절 상품</div><div class="v">${s.stock.soldOut}</div></div>
    </div>
    <p class="hint">재고가 줄기만 하고 늘지 않으면 농가의 출하가 멈춘 것입니다.</p>
    <div class="tblwrap" style="margin-top:16px">${rows ? `<table>
      <thead><tr><th>지역</th><th class="num">건수</th><th class="num">수량</th>
        <th class="num">매출</th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="empty">아직 수령완료된 거래가 없습니다.</div>'}</div>`);
};

let USER_CACHE = [];

RENDER.users = async () => {
  const [d, places] = await Promise.all([
    api('/api/admin/users'),
    api('/api/bootstrap').then((b) => b.PLACES).catch(() => ({})),
  ]);
  USER_CACHE = d.users;
  window._PLACES = places;

  const rows = d.users.map((u) => `<tr>
    <td>${esc(u.nickname)}<div style="color:var(--text-mut);font-size:12px">${esc(u.email)}</div></td>
    <td>${u.roles.map((r) => `<span class="rolechip">${esc(ROLE_KO[r] || r)}</span>`).join(' ')}</td>
    <td style="font-size:12px;color:var(--text-mut)">${esc(scopeText(u.scope))}</td>
    <td>${esc(u.status)}</td>
    <td><button class="btn sm" onclick="editUser('${esc(u.id)}')">역할 변경</button></td>
  </tr>`).join('');

  return page('계정 · 역할', '역할과 담당 범위를 함께 지정해야 합니다. 범위가 없으면 아무것도 못 봅니다.', `
    <div class="tblwrap"><table>
      <thead><tr><th>계정</th><th>역할</th><th>담당 범위</th><th>상태</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div id="editor"></div>`);
};

const ROLE_KO = {
  customer: '일반', producer: '생산자', store_manager: '매장 관리인',
  operator: '운영자', super_admin: '최고관리자',
};

function scopeText(sc) {
  const bits = [];
  if (sc.storeKeys && sc.storeKeys.length) bits.push('거점 ' + sc.storeKeys.length);
  if (sc.productIds && sc.productIds.length) bits.push('상품 ' + sc.productIds.length);
  if (sc.regions && sc.regions.length) bits.push(sc.regions.join('·'));
  return bits.join(' · ') || '—';
}

async function editUser(id) {
  const u = USER_CACHE.find((x) => x.id === id);
  if (!u) return;
  const places = window._PLACES || {};
  const pickupKeys = Object.keys(places).filter((k) => places[k] && places[k].type === 'pickup');
  const products = (await api('/api/products')).raw || [];

  $('editor').innerHTML = `<div class="card" style="margin-top:16px">
    <h3 style="font-size:16px;margin-bottom:12px">${esc(u.nickname)} 역할 변경</h3>
    <div class="grid g3">
      <div><label>역할 (복수 선택)</label>
        <select id="e-roles" multiple size="5">
          ${Object.keys(ROLE_KO).map((r) => `<option value="${r}"
            ${u.roles.includes(r) ? 'selected' : ''}>${esc(ROLE_KO[r])}</option>`).join('')}
        </select></div>
      <div><label>담당 거점 (매장 관리인)</label>
        <select id="e-stores" multiple size="5">
          ${pickupKeys.map((k) => `<option value="${esc(k)}"
            ${u.scope.storeKeys.includes(k) ? 'selected' : ''}>${esc(places[k].nm || k)}</option>`).join('')}
        </select></div>
      <div><label>담당 상품 (생산자)</label>
        <select id="e-products" multiple size="5">
          ${products.map((p) => `<option value="${esc(p.id)}"
            ${u.scope.productIds.includes(p.id) ? 'selected' : ''}>${esc(p.farm)} · ${esc(p.name)}</option>`).join('')}
        </select></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn pri" onclick="saveUser('${esc(u.id)}')">저장</button>
      <button class="btn" onclick="document.getElementById('editor').innerHTML=''">닫기</button>
      ${u.status === 'suspended'
        ? `<button class="btn" onclick="setStatus('${esc(u.id)}','active')">정지 해제</button>`
        : `<button class="btn danger" onclick="setStatus('${esc(u.id)}','suspended')">계정 정지</button>`}
    </div>
    <p class="hint">Ctrl(⌘) 을 누른 채 클릭하면 여러 개를 고를 수 있습니다.</p>
  </div>`;
  $('editor').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

const picked = (id) => Array.from($(id).selectedOptions).map((o) => o.value);

async function saveUser(id) {
  try {
    await put(`/api/admin/users/${encodeURIComponent(id)}/roles`, {
      roles: picked('e-roles'),
      scope: { storeKeys: picked('e-stores'), productIds: picked('e-products'), regions: [] },
    });
    go('users');
    setTimeout(() => say('ok', '역할을 저장했습니다.'), 30);
  } catch (e) { say('err', e.message); }
}

async function setStatus(id, status) {
  try {
    await put(`/api/admin/users/${encodeURIComponent(id)}/status`, { status });
    go('users');
    setTimeout(() => say('ok', '상태를 바꿨습니다.'), 30);
  } catch (e) { say('err', e.message); }
}

RENDER.audit = async () => {
  const d = await api('/api/admin/audit?limit=200');
  const names = {};
  try { (await api('/api/admin/users')).users.forEach((u) => { names[u.id] = u.nickname; }); }
  catch (e) { /* 이름은 없어도 됩니다 */ }

  const rows = d.rows.map((r) => `<tr>
    <td style="white-space:nowrap;font-size:12px">${esc(String(r.at).replace('T', ' ').slice(0, 19))}</td>
    <td>${esc(names[r.actorId] || r.actorId)}</td>
    <td><code>${esc(r.action)}</code></td>
    <td style="font-size:12px;color:var(--text-mut)">${esc(r.targetType)}:${esc(r.targetId)}</td>
  </tr>`).join('');

  return page('감사 로그', '되돌리기 어려운 변경만 남깁니다.', `
    <div class="tblwrap">${rows ? `<table>
      <thead><tr><th>시각</th><th>실행자</th><th>행위</th><th>대상</th></tr></thead>
      <tbody>${rows}</tbody></table>` : '<div class="empty">기록이 없습니다.</div>'}</div>`);
};

/* ================================================================
   진입
   ================================================================ */

/** 아이디·비밀번호 로그인. 카카오 계정이 없어도 역할 화면을 확인할 수 있습니다. */
async function localLogin(ev) {
  if (ev) ev.preventDefault();
  const msg = $('gate-msg');
  msg.hidden = true;
  try {
    await post('/api/auth/login', {
      loginId: $('lg-id').value.trim(), password: $('lg-pw').value,
    });
    location.reload();
  } catch (e) {
    msg.textContent = e.message;
    msg.hidden = false;
  }
  return false;
}

async function devLogin() {
  try {
    const role = $('dev-role').value;
    // 로컬 확인용이라 범위를 넉넉히 채워 줍니다. 실제 부여는 최고관리자가 합니다.
    const b = await api('/api/bootstrap');
    const pickupKeys = Object.keys(b.PLACES || {}).filter((k) => b.PLACES[k].type === 'pickup');
    const productIds = (b.PL || []).map((p) => p.fid);
    await post('/api/auth/dev-login', {
      nickname: $('dev-nick').value || '운영 테스트',
      roles: [role],
      scope: {
        storeKeys: role === 'store_manager' ? pickupKeys : [],
        productIds: role === 'producer' ? productIds : [],
        regions: [],
      },
    });
    location.reload();
  } catch (e) {
    $('gate-msg').textContent = e.message;
    $('gate-msg').hidden = false;
  }
}

async function logout() {
  try { await post('/api/auth/logout'); } catch (e) { /* 무시 */ }
  location.reload();
}

async function boot() {
  let me = null;
  try { me = await api('/api/auth/roles'); } catch (e) { me = null; }

  const usable = me && me.roles && me.roles.some((r) => r !== 'customer');
  if (!usable) {
    $('gate').hidden = false;
    try {
      const cfg = await api('/api/auth/config');
      if (cfg.devLogin) $('devbox').hidden = false;
    } catch (e) { /* 무시 */ }
    if (me && me.roles && me.roles.length) {
      $('gate-msg').textContent = '이 계정에는 운영 권한이 없습니다. 관리자에게 역할을 요청하세요.';
      $('gate-msg').hidden = false;
    }
    return;
  }

  ME = me;
  $('app').hidden = false;
  $('who-name').textContent = (me.user && me.user.nickname) || '운영자';
  $('who-roles').innerHTML = me.roles
    .map((r) => `<span class="rolechip">${esc(ROLE_KO[r] || r)}</span>`).join('');

  const first = allowed()[0];
  if (first) go(first.id);
  else $('main').innerHTML = '<div class="card"><div class="empty">사용할 수 있는 화면이 없습니다.</div></div>';
}

boot();
</script>
